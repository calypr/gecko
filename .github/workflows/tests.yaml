name: Go Tests

on: [ pull_request, workflow_call ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "The following files are not gofmt'd:"
          echo "$unformatted"
          exit 1
        fi

    - name: Check module files
      run: go mod tidy -diff

    - name: Vet
      run: go vet ./...

    - name: Install analyzers
      run: |
        go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
        go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Staticcheck
      run: staticcheck ./...

    - name: Vulnerability scan
      run: govulncheck ./...

    - name: Start PostgreSQL
      run: |
        docker rm -f gecko-postgres-test > /dev/null 2>&1 || true

        docker run -d \
          --name gecko-postgres-test \
          -p 8081:5432 \
          -e POSTGRES_PASSWORD=your_strong_password \
          -e POSTGRES_USER=postgres \
          postgres:15 > /dev/null

        # Wait for PostgreSQL to be ready
        for i in {1..30}; do
          if docker exec gecko-postgres-test pg_isready -U postgres -h localhost; then
            break
          fi
          sleep 1
        done

    - name: Setup Database
      run: |
        docker exec gecko-postgres-test psql -U postgres -c "CREATE DATABASE testdb;"

        docker exec gecko-postgres-test psql -U postgres -d testdb -c "
          DO \$\$
          BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_namespace WHERE nspname = 'config_schema') THEN
                  CREATE SCHEMA config_schema;
              END IF;
          END \$\$;

          CREATE OR REPLACE FUNCTION create_config_table(schema_name TEXT, table_name TEXT)
          RETURNS void AS \$\$
          BEGIN
              EXECUTE format('
                  CREATE TABLE IF NOT EXISTS %I.%I (
                      name VARCHAR(255) PRIMARY KEY,
                      content JSONB
                  );
              ', schema_name, table_name);
          END;
          \$\$ LANGUAGE plpgsql;

          DO \$\$
          DECLARE
              config_tables TEXT[] := ARRAY['explorer', 'nav', 'file_summary', 'project', 'projects'];
              table_name TEXT;
          BEGIN
              FOREACH table_name IN ARRAY config_tables
              LOOP
                  PERFORM create_config_table('config_schema', table_name);
              END LOOP;
          END \$\$;

          DROP FUNCTION create_config_table(TEXT, TEXT);
        "
      env:
        PGPASSWORD: your_strong_password


    - name: Build server with race detector
      run: go build -race -o bin/gecko .

    - name: Run Tests
      run: |
        ./bin/gecko \
          -db "postgresql://postgres:your_strong_password@localhost:8081/testdb?sslmode=disable" \
          -port 8080 \
          -git-data-dir /tmp/gecko-git &

        # Wait for application to be ready
        echo "Waiting for application to be ready..."
        for i in {1..30}; do
          if curl --silent --fail http://localhost:8080/health > /dev/null; then
            echo "Application is ready!"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Timeout waiting for application"
            # Show logs to help debug
            kill $(jobs -p) || true
            exit 1
          fi
          sleep 1
        done
        go test -race -count=1 -timeout=10m -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -v ./...

    - name: Coverage summary
      if: always()
      run: |
        if [ -f coverage.out ]; then
          go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: true

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out
        if-no-files-found: ignore
